---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - 'pyproject.toml'

# Run releases one after another so parallel merges cannot race on tags
# or on which GitHub release ends up marked as latest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # to push tags and create releases
      id-token: write    # to sign the attestation
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        id: tagging
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: master
          INITIAL_VERSION: 1.0.0
          # Only evaluate the message of the pushed (merge) commit, so the maintainer
          # decides the bump at merge time. 'compare' would also scan every commit
          # body since the last tag, including contributor commits and old messages
          # that merely mention a token.
          # Trade-off: GitHub keeps only one pending run per concurrency group. If
          # three release-relevant merges land within one release build, the middle
          # run is cancelled and its token is not evaluated; the newest merge still
          # releases with its own token.
          BRANCH_HISTORY: last
          # Only release when the merge commit contains #major, #minor or #patch.
          DEFAULT_BUMP: none
          # The action matches tokens case-sensitively via an unquoted bash `case`
          # pattern, so use globs to also accept e.g. #Patch or #None.
          MAJOR_STRING_TOKEN: '#[Mm][Aa][Jj][Oo][Rr]'
          MINOR_STRING_TOKEN: '#[Mm][Ii][Nn][Oo][Rr]'
          PATCH_STRING_TOKEN: '#[Pp][Aa][Tt][Cc][Hh]'
          NONE_STRING_TOKEN: '#[Nn][Oo][Nn][Ee]'
      - name: Set up QEMU
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Quay.io
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_BOT_USERNAME }}
          password: ${{ secrets.QUAY_BOT_PASSWORD }}

      - name: Login to ghcr.io
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          push: true
          provenance: true
          files: |
            docker-bake.hcl
          set: |
            k8s-sidecar.tags=docker.io/kiwigrid/k8s-sidecar:${{ steps.tagging.outputs.new_tag }}
            k8s-sidecar.tags=quay.io/kiwigrid/k8s-sidecar:${{ steps.tagging.outputs.new_tag }}
            k8s-sidecar.tags=ghcr.io/kiwigrid/k8s-sidecar:${{ steps.tagging.outputs.new_tag }}

      - name: Build Changelog
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        with:
          configuration: ".github/workflows/release-notes-config.json"
          # Pin the range to this run's tags; otherwise the action resolves the
          # newest tags in the repo, which may belong to a later release.
          fromTag: ${{ steps.tagging.outputs.old_tag }}
          toTag: ${{ steps.tagging.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.tagging.outputs.part != '' && steps.tagging.outputs.part != 'none'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tagging.outputs.new_tag }}
          name: v${{ steps.tagging.outputs.new_tag }}
          body: ${{ steps.build_changelog.outputs.changelog }}
          draft: false
          prerelease: false
